[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wikiart-style-classifier"
version = "0.1.0"
description = "Compare dense, convolutional and classical WikiArt style classifiers"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wikiart = ["templates/*.html", "static/*.css", "static/*.js"]
